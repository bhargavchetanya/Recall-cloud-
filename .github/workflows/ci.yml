name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # T1, T10 and the search-quality tests need the real embedding model (about 90 MB, pinned and checksummed).
      - uses: actions/cache@v4
        with:
          path: backend/models
          key: minilm-l6-v2-1110a243
      - run: ./scripts/fetch-model.sh
        working-directory: .
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - uses: actions/cache@v4
        with:
          path: extension/.vscode-test
          key: vscode-test-${{ runner.os }}
      - run: npm ci
      - run: xvfb-run -a npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: recall-vsix
          path: extension/recall.vsix

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Runs the same compose file the AWS instance runs (deploy/aws), with PostgreSQL in a container instead of RDS.
      # The image build downloads the pinned embedding model; the scripts need only Node.
      - run: docker build -t recall-backend:ci backend
      - name: Start the AWS stack locally
        working-directory: deploy/aws
        run: |
          cat > .env <<EOF
          RECALL_IMAGE=recall-backend:ci
          DB_HOST=postgres
          DB_PASSWORD=ci-password
          RABBITMQ_PASSWORD=ci-password
          RECALL_JWT_SECRET=ci-secret-that-is-at-least-32-bytes-long
          RECALL_SITE=localhost
          RECALL_IP=127.0.0.1
          EOF
          mkdir -p site && echo ok > site/index.html
          docker compose --profile localdb up -d --wait
      - run: ./scripts/seed-demo.sh
      - run: ./scripts/e2e.sh
      - run: curl -fsk https://localhost/api/v1/health
      - if: failure()
        working-directory: deploy/aws
        run: docker compose --profile localdb logs --no-color backend caddy | tail -200
