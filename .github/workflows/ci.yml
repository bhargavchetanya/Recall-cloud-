name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # T1, T10 and the search-quality tests need the real embedding model (about 90 MB, pinned and checksummed).
      - uses: actions/cache@v4
        with:
          path: backend/models
          key: minilm-l6-v2-1110a243
      - run: ./scripts/fetch-model.sh
        working-directory: .
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - uses: actions/cache@v4
        with:
          path: extension/.vscode-test
          key: vscode-test-${{ runner.os }}
      - run: npm ci
      - run: xvfb-run -a npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: recall-vsix
          path: extension/recall.vsix

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The image build downloads the pinned embedding model; the scripts need only Node.
      - run: docker compose up -d --build
      - run: ./scripts/seed-demo.sh
      - run: ./scripts/e2e.sh
      - if: failure()
        run: docker compose logs --no-color backend | tail -200
