name: recall

services:
  postgres:
    image: pgvector/pgvector:pg16
    mem_limit: 512m
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recall}
      POSTGRES_USER: ${POSTGRES_USER:-recall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recall}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    mem_limit: 512m
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-recall}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-recall}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  backend:
    build: ./backend
    mem_limit: 1g
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-recall}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-recall}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-recall}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-recall}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-recall}
      # Dev default so a fresh clone starts; set RECALL_JWT_SECRET in .env for anything shared.
      RECALL_JWT_SECRET: ${RECALL_JWT_SECRET:-insecure-dev-secret-change-me-in-your-env-file}
      # Set SPRING_PROFILES_ACTIVE=ai in .env to use a local Ollama as fallback; without it (or without Ollama)
      # unanswered questions simply get NONE.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      RECALL_OLLAMA_URL: ${RECALL_OLLAMA_URL:-http://host.docker.internal:11434}
      RECALL_OLLAMA_MODEL: ${RECALL_OLLAMA_MODEL:-qwen2.5-coder:7b}
    # Lets the container reach Ollama on the host on Linux too (Docker Desktop provides it already).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/v1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  pgdata:
