# Production overrides for a single EC2 instance (see docs/DEPLOY_AWS.md).
#   docker compose -f docker-compose.yml -f deploy/aws/docker-compose.prod.yml up -d --build
# deploy/aws/deploy.sh runs exactly this. Paths here are relative to the repository root (the first file's folder).
#
# Only Caddy is reachable from outside: it terminates HTTPS and forwards to the backend. Postgres, RabbitMQ and the
# backend lose their host ports, so they are reachable only inside the Docker network.

services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

  rabbitmq:
    ports: !reset []
    environment:
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}

  backend:
    ports: !reset []
    environment:
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}
      RECALL_JWT_SECRET: ${RECALL_JWT_SECRET:?set RECALL_JWT_SECRET in .env}
      # No Ollama on the server: unanswered questions get NONE.
      SPRING_PROFILES_ACTIVE: ""

  caddy:
    image: caddy:2.8
    mem_limit: 128m
    restart: unless-stopped
    environment:
      # A host name (HTTPS with a Let's Encrypt certificate) or ":80" (plain HTTP).
      RECALL_SITE: ${RECALL_SITE:?set RECALL_SITE in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/aws/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
